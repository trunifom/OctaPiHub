[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "octapihub"
version = "0.1.0.dev0"
description = "Local-first smart-home and music hub for Timeular / ZEI cubes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "bleak>=3,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
  "tzdata>=2024.1",
]

[project.scripts]
octapihub = "octapihub.web.__main__:main"

[project.optional-dependencies]
music = ["pychromecast>=14,<15"]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"octapihub.web" = ["templates/*.html", "static/*", "help/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE", "T20", "C4", "PIE", "SIM", "S", "RUF100"]
ignore = ["S101", "SIM102", "SIM117"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20", "B008", "BLE", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/octapihub"]
